<h2 class="sr-only">Validation une à une des questions du chapitre Biologie Physique NS1 ch.3 (Gravitation universelle, poids et masse).</h2>
<style>
.qc{border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;margin:0 0 10px;background:var(--surface-2)}
.qc.v{border-color:var(--border-success)}.qc.r{border-color:var(--border-danger)}.qc.m{border-color:var(--border-warning)}
.ch{font-size:14px;padding:2px 0;color:var(--text-secondary)}.ch.ok{color:var(--text-success);font-weight:500}
.bt{font-size:13px;padding:4px 10px}.bt.on.v{background:var(--bg-success);color:var(--text-success)}.bt.on.r{background:var(--bg-danger);color:var(--text-danger)}.bt.on.m{background:var(--bg-warning);color:var(--text-warning)}
.bd{font-size:11px;padding:2px 8px;border-radius:var(--radius);background:var(--surface-1);color:var(--text-secondary)}
.sr{font-size:11px;padding:2px 8px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent)}
.gh{font-size:13px;color:var(--text-secondary);margin:1rem 0 8px}
</style>
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0.5rem 0 0.5rem">
<span style="font-size:14px;color:var(--text-secondary)">Traitées : <b id="cnt" style="font-weight:500;color:var(--text-primary)">0</b> / <span id="tot"></span></span>
<button class="bt" id="allv"><i class="ti ti-checks" aria-hidden="true"></i> Valider les non traitées</button>
</div>
<div id="list"></div>
<div style="padding:0.5rem 0 1rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
<button id="send">Envoyer mes validations ↗</button>
<span id="err" style="font-size:13px;color:var(--text-danger)"></span>
</div>
<script>
const Q=[
["g", "La gravitation universelle"],
["PN1_03-01", "M", "Force attractive qui s'exerce entre tous les corps qui ont une masse", ["La gravitation", "La pesanteur", "La flottaison", "Le magnétisme"], "Elle maintient la Lune autour de la Terre et les planètes autour du Soleil.", "Larousse : gravitation", "D"],
["PN1_03-02", "F", "Qui a énoncé la loi de la gravitation universelle ?", ["Isaac Newton", "Galilée", "Albert Einstein", "Johannes Kepler"], "Il l'a publiée en 1687 dans son ouvrage Principia.", "Programme B1 ; Larousse : gravitation", "C"],
["PN1_03-03", "M", "De quoi dépend la force de gravitation entre deux corps ?", ["Leurs masses et leur distance", "Leur volume seulement", "Leur couleur et leur forme", "Leur température et leur vitesse"], "Elle augmente avec les masses et diminue quand la distance augmente.", "Programme B1 ; Larousse : gravitation", "C"],
["PN1_03-04", "D", "Quand la distance entre deux corps double, que devient la force de gravitation entre eux ?", ["Elle est divisée par quatre", "Elle est divisée par deux", "Elle double", "Elle reste la même"], "Elle varie comme l'inverse du carré de la distance : F = G·m·m′ / d².", "Programme B1 ; Larousse : gravitation", "C"],
["PN1_03-05", "M", "Quelle est l'expression de la loi de la gravitation universelle ?", ["F = G·m·m′/d²", "F = G·m·m′·d²", "F = G·(m+m′)/d", "F = m·g"], "G est la constante de gravitation, égale à 6,67 × 10⁻¹¹ N·m²/kg².", "Programme B1 ; Larousse : gravitation", "C"],
["PN1_03-06", "F", "La force de gravitation entre deux corps est-elle attractive ou répulsive ?", ["Toujours attractive", "Toujours répulsive", "Parfois répulsive", "Nulle dans le vide"], "Deux corps s'attirent mutuellement avec des forces de même valeur, même si l'un est bien plus massif que l'autre.", "Programme B1", "C"],
["g", "Le poids"],
["PN1_03-11", "F", "Force d'attraction exercée par la Terre, ou un autre astre, sur un corps proche de sa surface", ["Le poids", "La masse", "La pression", "La densité"], "Il se mesure avec un dynamomètre et s'exprime en newtons.", "Larousse : poids (sens 2, précisé en physique) ; Programme B1", "D"],
["PN1_03-12", "F", "Appareil destiné à la mesure d'une force", ["Un dynamomètre", "Un baromètre", "Un ampèremètre", "Un thermomètre"], "À l'intérieur, un ressort s'allonge proportionnellement à la force appliquée.", "Larousse : dynamomètre", "D"],
["PN1_03-13", "F", "Quelle est la nature du poids d'un corps ?", ["Une force", "Une quantité de matière", "Une énergie", "Une vitesse"], "C'est pourquoi le poids s'exprime en newtons et se représente par une flèche, un vecteur.", "Programme B1", "C"],
["PN1_03-14", "F", "Dans quelle unité exprime-t-on le poids d'un corps ?", ["Le newton", "Le kilogramme", "Le gramme", "Le joule"], "Le newton (N) est l'unité SI de force : 1 N est le poids d'une masse d'environ 100 g sur Terre.", "Larousse : newton", "C"],
["PN1_03-15", "M", "Quelle est la direction du poids d'un corps ?", ["La verticale, vers le bas", "L'horizontale, vers l'avant", "La verticale, vers le haut", "La direction du Soleil"], "Il s'applique au centre de gravité du corps et pointe vers le centre de la Terre.", "Programme B1", "C"],
["PN1_03-16", "F", "Quelle est la formule du poids d'un corps ?", ["P = m × g", "P = m / g", "P = m + g", "P = g / m"], "P est en newtons, m en kilogrammes et g en newtons par kilogramme.", "Programme B1", "C"],
["Q1214", "F", "Quel est le poids d'un objet de masse 5 kg sur Terre (g = 10 N/kg) ?", ["50 N", "5 N", "500 N", "0,5 N"], "P = m × g = 5 × 10 = 50 N.", "Base Q1214 (modifiée)", "C"],
["Q1235", "F", "Quelle est la valeur de g à la surface de la Terre ?", ["Environ 9,8 N/kg", "Environ 1,6 N/kg", "Environ 98 N/kg", "Environ 0,98 N/kg"], "En calcul scolaire, on prend souvent g = 10 N/kg.", "Base Q1235 (modifiée)", "C"],
["PN1_03-19", "M", "État dans lequel les effets de la pesanteur sont annulés, comme à bord d'une station spatiale en orbite", ["L'apesanteur", "L'inertie", "La gravitation", "La flottaison"], "Les astronautes flottent parce qu'ils tombent en permanence avec la station, pas parce que la gravité y est nulle.", "Larousse : apesanteur", "D"],
["g", "Masse et poids : les différences"],
["Q1218", "M", "Laquelle de ces propriétés distingue la masse du poids ?", ["Masse fixe, poids variable", "Masse variable, poids fixe", "Les deux varient avec le lieu", "Les deux restent fixes"], "La masse, en kilogrammes, ne change pas ; le poids, en newtons, dépend de la gravité du lieu : un objet est plus léger sur la Lune.", "Base Q1218 (modifiée)", "C"],
["Q1226", "D", "Un astronaute pèse 80 N sur Terre. Quel est son poids sur la Lune (g = 1,6 N/kg) ?", ["Environ 13 N", "80 N", "0 N", "160 N"], "Sa masse est m = 80 / 10 = 8 kg ; sur la Lune, P = 8 × 1,6 ≈ 13 N.", "Base Q1226 (modifiée)", "C"],
["g", "Le mouvement des planètes et des satellites"],
["PN1_03-31", "M", "Quelle force fait tomber une pomme et retient la Lune en orbite ?", ["La gravitation terrestre", "La force magnétique", "La poussée d'Archimède", "La force de frottement"], "C'est la même force : la Lune « tombe » sans cesse vers la Terre sans jamais l'atteindre, car elle avance aussi sur le côté.", "Programme B1 ; Alt. ch.1.2", "C"],
["PN1_03-32", "M", "Quelle est la forme de l'orbite d'une planète autour du Soleil ?", ["Une ellipse", "Une parabole", "Une droite", "Un carré"], "C'est la première loi de Kepler ; l'orbite de la Terre est presque un cercle.", "Alt. ch.1.2.2", "C"],
["PN1_03-33", "F", "En combien de temps la Terre fait-elle un tour complet autour du Soleil ?", ["365 jours environ", "24 heures", "30 jours", "12 ans"], "C'est sa période de révolution : une année.", "Alt. ch.1.2.2", "C"],
["PN1_03-34", "F", "Quel mouvement de la Terre produit l'alternance du jour et de la nuit ?", ["Sa rotation sur elle-même", "Sa révolution autour du Soleil", "Sa translation vers la Lune", "L'inclinaison de la Lune"], "Un tour complet sur elle-même dure environ 24 heures.", "Alt. ch.1.2.2", "C"],
["PN1_03-35", "M", "Combien de temps la Lune met-elle pour faire le tour de la Terre ?", ["Environ 27 jours", "Environ 7 jours", "Environ 365 jours", "Environ 24 heures"], "Les phases de la Lune reviennent tous les 29,5 jours, car la Terre a elle aussi avancé autour du Soleil.", "Alt. ch.1.2.3", "C"],
["PN1_03-36", "M", "Que fait un satellite géostationnaire, vu depuis la Terre ?", ["Il reste au-dessus du même point", "Il se déplace très vite", "Il tombe vers la Terre", "Il tourne autour de la Lune"], "Situé à environ 36 000 km d'altitude, il tourne avec la Terre en 24 heures ; il sert aux télécommunications et à la météorologie.", "Alt. ch.1.2.3", "C"],
["g", "Gravitation : compléments"],
["PN1_03-41", "F", "Quel fruit, selon la légende, a fait réfléchir Newton à la gravitation ?", ["La pomme", "La mangue", "La banane", "L'orange"], "Voir tomber un fruit l'aurait conduit à relier la chute des corps sur Terre au mouvement de la Lune.", "Larousse : gravitation ; Programme B1", "C"],
["PN1_03-42", "F", "La gravitation agit-elle à distance ou au contact ?", ["À distance", "Au contact seulement", "Seulement dans l'air", "Seulement sur Terre"], "Elle agit même à travers le vide de l'espace : c'est une action à distance, comme la force magnétique.", "Programme B1 (action à distance)", "C"],
["PN1_03-43", "D", "Si la masse d'un des deux corps double, que devient la force de gravitation entre eux ?", ["Elle double", "Elle est divisée par deux", "Elle reste la même", "Elle est multipliée par quatre"], "La force est proportionnelle à chacune des masses : F = G·m·m′/d².", "Programme B1", "C"],
["PN1_03-44", "M", "Quel phénomène sur Terre est provoqué surtout par l'attraction de la Lune ?", ["Les marées", "Les séismes", "Les cyclones", "Les éclipses"], "L'attraction de la Lune, et dans une moindre mesure du Soleil, soulève les océans deux fois par jour.", "Alt. ch.1.2.3", "C"],
["PN1_03-45", "M", "Quel savant du XVIIᵉ siècle a établi les lois du mouvement des planètes autour du Soleil ?", ["Johannes Kepler", "Nicolas Copernic", "Galilée", "Isaac Newton"], "Ses trois lois décrivent des orbites en ellipse ; Newton les a expliquées ensuite par la gravitation.", "Alt. ch.1.2.2", "C"],
["g", "Poids et masse : compléments"],
["PN1_03-51", "M", "Comment appelle-t-on la grandeur g, exprimée en N/kg ?", ["L'intensité de la pesanteur", "La constante de gravitation", "La masse volumique", "L'accélération électrique"], "Elle indique le poids d'un kilogramme : 9,8 N/kg sur Terre.", "Programme B1", "C"],
["PN1_03-52", "M", "Comment appelle-t-on le point d'application du poids d'un corps ?", ["Son centre de gravité", "Son sommet", "Sa base", "Sa surface"], "Pour un objet homogène et symétrique, il se confond avec son centre géométrique.", "Programme B1", "C"],
["Q1238", "M", "Où se trouve le centre de gravité d'une sphère homogène ?", ["En son centre", "À sa surface", "À sa base", "Au sommet"], "Pour un objet homogène et symétrique (sphère, cube), le centre de gravité coïncide avec le centre géométrique.", "Base Q1238 (modifiée)", "C"],
["PN1_03-54", "F", "Quel est à peu près le poids d'une masse de 100 g sur Terre ?", ["Environ 1 N", "Environ 10 N", "Environ 0,1 N", "Environ 100 N"], "P = 0,1 kg × 10 N/kg = 1 N ; c'est pourquoi 1 N correspond à peu près au poids d'une tablette de chocolat.", "Programme B1", "C"],
["PN1_03-55", "M", "Quelle est la masse d'un objet dont le poids est de 300 N (g = 10 N/kg) ?", ["30 kg", "3 kg", "300 kg", "3 000 kg"], "m = P / g = 300 / 10 = 30 kg.", "Programme B1 (calcul court)", "C"],
["PN1_03-56", "M", "Sur lequel de ces astres un même objet pèse-t-il le plus ?", ["Jupiter", "La Terre", "La Lune", "Mars"], "La pesanteur à la surface de Jupiter vaut environ 25 N/kg, contre 9,8 sur Terre, 3,7 sur Mars et 1,6 sur la Lune.", "Programme B1", "C"],
["PN1_03-57", "M", "Quelle fraction de son poids terrestre un objet pèse-t-il sur la Lune ?", ["Environ un sixième", "Environ un tiers", "Environ la moitié", "Le double"], "Sa masse n'a pas changé, mais la pesanteur lunaire est environ six fois plus faible.", "Programme B1", "C"]
];
const QQ=Q.filter(q=>q[0]!=='g');document.getElementById('tot').textContent=QQ.length;
const st={},cm={},L=document.getElementById('list');
const lbl={F:'Facile',M:'Moyen',D:'Difficile'};
Q.forEach(q=>{if(q[0]==='g'){const h=document.createElement('div');h.className='gh';h.textContent=q[1];L.appendChild(h);return}
const d=document.createElement('div');d.className='qc';d.id='c'+q[0];
d.innerHTML=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap"><span style="font-size:12px;color:var(--text-muted)">${q[0]}</span><span class="bd">${lbl[q[1]]}</span><span class="bd">${(q[0].startsWith('Q')?'Déjà en base · ':'')+(q[6]==='D'?'Définition':'Connaissance')}</span><span class="sr">${q[5]}</span></div>
<div style="font-size:15px;font-weight:500;margin-bottom:6px">${q[2]}</div>
${q[3].map((c,i)=>`<div class="ch ${i===0?'ok':''}">${i===0?'<i class="ti ti-check" aria-hidden="true"></i> ':'<span style="display:inline-block;width:18px"></span>'}${c}</div>`).join('')}
<div style="font-size:13px;color:var(--text-muted);margin:6px 0 8px">${q[4]}</div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="bt v" data-a="v">Valider</button><button class="bt m" data-a="m">À modifier</button><button class="bt r" data-a="r">Rejeter</button></div>
<input type="text" placeholder="Que faut-il changer ?" style="display:none;width:100%;margin-top:8px">`;
const inp=d.querySelector('input');inp.oninput=()=>{cm[q[0]]=inp.value;document.getElementById('err').textContent=''};
d.querySelectorAll('button').forEach(b=>b.onclick=()=>set(q[0],b.dataset.a));L.appendChild(d)});
function set(id,a){st[id]=a;const d=document.getElementById('c'+id);d.className='qc '+a;
d.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.a===a));
d.querySelector('input').style.display=a==='m'?'block':'none';
document.getElementById('cnt').textContent=Object.keys(st).length;document.getElementById('err').textContent=''}
document.getElementById('allv').onclick=()=>QQ.forEach(q=>{if(!st[q[0]])set(q[0],'v')});
document.getElementById('send').onclick=()=>{const e=document.getElementById('err');
const n=QQ.filter(q=>!st[q[0]]).map(q=>q[0]);if(n.length){e.textContent=n.length+' question(s) non traitée(s) : '+n.slice(0,6).join(', ')+(n.length>6?'…':'');return}
const m=QQ.filter(q=>st[q[0]]==='m');const bad=m.filter(q=>!(cm[q[0]]||'').trim());if(bad.length){e.textContent='Précise la modification pour '+bad.map(q=>q[0]).join(', ');return}
const v=QQ.filter(q=>st[q[0]]==='v').map(q=>q[0]),r=QQ.filter(q=>st[q[0]]==='r').map(q=>q[0]);
sendPrompt(`Validation Physique NS1 ch.3 (Gravitation universelle, poids et masse) — Validées (${v.length}) : ${v.join(', ')||'aucune'} · Rejetées (${r.length}) : ${r.join(', ')||'aucune'} · À modifier (${m.length}) : ${m.map(q=>q[0]+' → '+cm[q[0]]).join(' ; ')||'aucune'}`)};
</script>
