<h2 class="sr-only">Validation une à une des questions du chapitre Biologie Physique NS1 ch.1 (Grandeurs, mesures et états de la matière).</h2>
<style>
.qc{border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;margin:0 0 10px;background:var(--surface-2)}
.qc.v{border-color:var(--border-success)}.qc.r{border-color:var(--border-danger)}.qc.m{border-color:var(--border-warning)}
.ch{font-size:14px;padding:2px 0;color:var(--text-secondary)}.ch.ok{color:var(--text-success);font-weight:500}
.bt{font-size:13px;padding:4px 10px}.bt.on.v{background:var(--bg-success);color:var(--text-success)}.bt.on.r{background:var(--bg-danger);color:var(--text-danger)}.bt.on.m{background:var(--bg-warning);color:var(--text-warning)}
.bd{font-size:11px;padding:2px 8px;border-radius:var(--radius);background:var(--surface-1);color:var(--text-secondary)}
.sr{font-size:11px;padding:2px 8px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent)}
.gh{font-size:13px;color:var(--text-secondary);margin:1rem 0 8px}
</style>
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0.5rem 0 0.5rem">
<span style="font-size:14px;color:var(--text-secondary)">Traitées : <b id="cnt" style="font-weight:500;color:var(--text-primary)">0</b> / <span id="tot"></span></span>
<button class="bt" id="allv"><i class="ti ti-checks" aria-hidden="true"></i> Valider les non traitées</button>
</div>
<div id="list"></div>
<div style="padding:0.5rem 0 1rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
<button id="send">Envoyer mes validations ↗</button>
<span id="err" style="font-size:13px;color:var(--text-danger)"></span>
</div>
<script>
const Q=[
["g", "Grandeurs, unités et mesure"],
["PN1_01-01", "F", "Propriété d'un objet ou d'un phénomène que l'on peut exprimer par un nombre et une unité", ["Une grandeur physique", "Une loi physique", "Une constante universelle", "Un instrument de mesure"], "La longueur, la masse, la durée et la température sont des grandeurs physiques ; la couleur ou la beauté n'en sont pas.", "Programme A1 (savoir-faire : mesurer) — pas de définition physique au Larousse en ligne", "D"],
["PN1_01-02", "M", "Comparaison d'une grandeur à une référence de même nature, prise comme étalon", ["La mesure", "L'estimation", "L'hypothèse", "La conversion"], "Mesurer une longueur, c'est compter combien de fois l'étalon, par exemple le mètre, y est contenu.", "Larousse : mesure (sens 1)", "D"],
["PN1_01-03", "F", "Grandeur de référence servant à exprimer le résultat d'une mesure", ["Une unité", "Un symbole", "Une formule", "Un repère"], "Un résultat sans unité n'a pas de sens : « 5 » ne dit pas s'il s'agit de 5 mètres ou de 5 secondes.", "Programme A1 (pas de sens physique au Larousse en ligne)", "D"],
["PN1_01-04", "M", "Ensemble cohérent d'unités adopté par la communauté scientifique mondiale", ["Le Système international", "Le système impérial", "Le système CGS", "Le système décimal"], "Adopté en 1960, il est utilisé dans le monde entier en science ; certains pays gardent d'autres unités pour l'usage courant.", "Programme A1 (pas de définition au Larousse en ligne)", "D"],
["Q1312", "F", "Combien d'unités de base compte le Système international (SI) ?", ["7", "5", "10", "12"], "Mètre, kilogramme, seconde, ampère, kelvin, mole et candela ; toutes les autres unités s'en déduisent.", "Base Q1312 (explication reprise) — Larousse : kelvin, kilogramme", "C"],
["PN1_01-06", "F", "Quelle est l'unité de longueur du Système international ?", ["Le mètre", "Le pied", "Le pouce", "Le mille"], "Le mètre (m) est défini à partir de la distance parcourue par la lumière dans le vide pendant un très court instant.", "Programme A1", "C"],
["PN1_01-07", "M", "Quelle est l'unité de masse du Système international ?", ["Le kilogramme", "Le gramme", "La tonne", "Le newton"], "Le gramme et la tonne sont des sous-multiples ou multiples usuels, mais l'unité de base est le kilogramme (kg) ; le newton mesure une force.", "Larousse : kilogramme", "C"],
["PN1_01-08", "M", "Quelle est l'unité de temps du Système international ?", ["La seconde", "La minute", "L'heure", "Le jour"], "La minute et l'heure sont tolérées avec le SI, mais l'unité de base est la seconde (s).", "Programme A1", "C"],
["PN1_01-09", "M", "Quelle est l'unité de température du Système international ?", ["Le kelvin", "Le degré Celsius", "Le degré Fahrenheit", "Le joule"], "0 K correspond à − 273,15 °C ; une variation de 1 K vaut une variation de 1 °C.", "Larousse : kelvin", "C"],
["PN1_01-10", "M", "Quelle est l'unité de volume du Système international ?", ["Le mètre cube", "Le litre", "Le centimètre cube", "Le gramme"], "Le litre (1 dm³) est très employé mais n'est pas une unité du SI ; 1 m³ = 1 000 L.", "Programme A1", "C"],
["PN1_01-11", "F", "Combien de kilogrammes représentent 3 000 grammes ?", ["3 kg", "30 kg", "0,3 kg", "300 kg"], "1 kg = 1 000 g, donc 3 000 g = 3 kg.", "Programme A1 (conversions)", "C"],
["Q1318", "F", "Comment convertit-on 5 km en mètres ?", ["5 000 m", "0,005 m", "500 m", "50 m"], "1 km = 1 000 m, donc 5 km = 5 × 1 000 m = 5 000 m.", "Base Q1318 (explication reprise)", "C"],
["PN1_01-13", "M", "Un volume de 1 litre est égal à combien de centimètres cubes ?", ["1 000 cm³", "10 cm³", "100 cm³", "10 000 cm³"], "1 L = 1 dm³ = 1 000 cm³ ; en pratique, 1 mL = 1 cm³.", "Programme A1 (conversions)", "C"],
["Q1315", "F", "Écriture d'un nombre sous la forme a × 10ⁿ, avec a compris entre 1 et 10", ["La notation scientifique", "La notation décimale", "La notation fractionnaire", "La notation romaine"], "Elle simplifie l'écriture des très grands et très petits nombres : 300 000 000 m/s s'écrit 3 × 10⁸ m/s.", "Base Q1315 (modifiée) — Programme A1", "D"],
["Q1317", "M", "Puissance de dix la plus proche d'une valeur, utilisée pour estimer sa taille", ["L'ordre de grandeur", "L'incertitude", "L'exactitude", "La précision"], "Le rayon de la Terre, 6,4 × 10⁶ m, est de l'ordre de 10⁷ m.", "Base Q1317 (modifiée) — Programme A1 (pas de définition au Larousse en ligne)", "D"],
["g", "Instruments de mesure"],
["PN1_01-21", "F", "Quel instrument simple sert à mesurer une longueur ?", ["Une règle graduée", "Un chronomètre", "Une balance", "Une éprouvette"], "Pour de grandes longueurs, on utilise un mètre ruban ; pour de très petites, un pied à coulisse.", "Programme A1", "C"],
["PN1_01-22", "F", "Quel instrument de laboratoire sert à mesurer le volume d'un liquide ?", ["Une éprouvette graduée", "Un chronomètre", "Un thermomètre", "Une balance"], "On lit le volume au bas de la surface incurvée du liquide, l'œil à son niveau.", "Larousse : éprouvette (sens 2)", "C"],
["PN1_01-23", "F", "Appareil à plateaux ou à affichage numérique servant à peser", ["Une balance", "Un baromètre", "Un chronomètre", "Un voltmètre"], "Elle compare ou mesure des masses ; en laboratoire, on utilise surtout la balance électronique.", "Larousse : balance (sens 1, adapté)", "D"],
["PN1_01-24", "F", "Appareil destiné à la mesure des températures", ["Un thermomètre", "Un baromètre", "Un hygromètre", "Un voltmètre"], "Le thermomètre à alcool repose sur la dilatation d'un liquide ; il en existe aussi à affichage électronique.", "Larousse : thermomètre (sens 1)", "D"],
["PN1_01-25", "F", "Quel instrument sert à mesurer une durée ?", ["Un chronomètre", "Un baromètre", "Un dynamomètre", "Un ampèremètre"], "Il donne souvent le dixième ou le centième de seconde ; dans le SI, la durée s'exprime en secondes.", "Larousse : chronomètre", "C"],
["g", "Précision, exactitude et incertitude"],
["Q1313", "M", "Marge d'erreur possible autour du résultat d'une mesure", ["L'incertitude", "L'étalon", "L'unité", "L'ordre de grandeur"], "On l'écrit sous la forme valeur ± incertitude, par exemple 9,81 ± 0,02 m/s².", "Base Q1313 (modifiée) — Larousse : incertitude (sens math. 3, simplifié)", "D"],
["PN1_01-32", "M", "Qualité d'une mesure qui donne presque le même résultat quand on la répète", ["La précision", "L'exactitude", "L'incertitude", "La sensibilité"], "Un instrument précis donne des résultats très rapprochés d'une mesure à l'autre.", "Larousse : précision (sens 4)", "D"],
["Q1320", "M", "Qualité d'une mesure proche de la valeur vraie de la grandeur", ["L'exactitude", "La précision", "L'incertitude", "La sensibilité"], "Image de la cible : des tirs groupés mais loin du centre sont précis sans être exacts.", "Base Q1320 (modifiée) — Larousse : exactitude (sens 6)", "D"],
["Q1316", "F", "Grandeur définie par une valeur, une direction et un sens", ["Une grandeur vectorielle", "Une grandeur scalaire", "Une grandeur dérivée", "Une grandeur de base"], "Elle se représente par une flèche : la longueur indique la valeur, l'orientation donne la direction et le sens.", "Base Q1316 (modifiée) — Programme B1 (pas de définition au Larousse en ligne)", "D"],
["PN1_01-35", "M", "Grandeur entièrement définie par un nombre et son unité", ["Une grandeur scalaire", "Une grandeur vectorielle", "Une grandeur nulle", "Une grandeur variable"], "La masse, la température et le volume sont des grandeurs scalaires : aucune direction n'est nécessaire.", "Larousse : scalaire", "D"],
["PN1_01-36", "F", "Laquelle de ces grandeurs est vectorielle ?", ["La force", "La masse", "La température", "Le volume"], "Une force se décrit par son point d'application, sa direction, son sens et sa valeur.", "Programme A1 / B1", "C"],
["g", "La matière et ses états"],
["PN1_01-41", "F", "Substance qui constitue les corps et possède des propriétés physiques", ["La matière", "L'énergie", "La lumière", "L'espace"], "Tout ce qui a une masse et occupe un volume est de la matière : l'air, l'eau, le bois. La lumière n'en est pas.", "Larousse : matière (sens 1)", "D"],
["PN1_01-42", "F", "Corps qui garde sa forme propre et son volume propre", ["Un solide", "Un liquide", "Un gaz", "Un plasma"], "Les particules d'un solide sont serrées et ne bougent presque pas ; exemples : le fer, le bois, la glace.", "Larousse : solide (sens 1, adapté) — Programme A1", "D"],
["PN1_01-43", "F", "Corps qui prend la forme du récipient qui le contient mais dont le volume est déterminé", ["Un liquide", "Un solide", "Un gaz", "Un plasma"], "Ses particules sont proches mais glissent les unes sur les autres : eau, huile, alcool.", "Larousse : liquide (sens 3)", "D"],
["PN1_01-44", "F", "Corps qui occupe la totalité du volume du récipient dans lequel il est enfermé", ["Un gaz", "Un liquide", "Un solide", "Un plasma"], "Ses particules sont très espacées et très agitées ; l'air est un mélange de gaz.", "Larousse : gaz (sens 1)", "D"],
["PN1_01-45", "M", "Fluide composé de molécules gazeuses neutres, d'ions positifs et d'électrons", ["Le plasma", "Le gaz", "La vapeur", "Le gel"], "On le trouve dans le Soleil et les étoiles ; c'est le quatrième état de la matière. À ne pas confondre avec le plasma du sang.", "Larousse : plasma (sens 2)", "D"],
["PN1_01-46", "D", "Parmi ces exemples, lequel est un état intermédiaire entre solide et liquide ?", ["Une pâte", "La glace", "La vapeur d'eau", "Un fil de fer"], "Les pâtes et les gels se comportent à la fois comme des solides et comme des liquides.", "Programme A1 (états intermédiaires) — exemples à valider", "C"],
["PN1_01-47", "F", "Dans quel état de la matière les particules sont-elles les plus éloignées les unes des autres ?", ["L'état gazeux", "L'état solide", "L'état liquide", "L'état pâteux"], "Les particules d'un gaz se déplacent librement dans tout le volume disponible, d'où sa grande facilité à être comprimé.", "Programme A1", "C"],
["PN1_01-48", "F", "Constituant fondamental de la matière, formé d'un noyau et d'électrons", ["L'atome", "La molécule", "La cellule", "L'ion"], "Le diamètre d'un atome est de l'ordre de 10⁻¹⁰ m.", "Larousse : atome (sens 1) — Programme A1", "D"],
["PN1_01-49", "M", "Particule formée d'atomes, plus petite quantité d'un corps pur pouvant exister à l'état libre", ["Une molécule", "Un atome", "Un ion", "Un cristal"], "La molécule d'eau est formée de deux atomes d'hydrogène et d'un atome d'oxygène.", "Larousse : molécule", "D"],
["g", "Masse, volume, masse volumique et densité"],
["PN1_01-51", "F", "Grandeur qui exprime la quantité de matière que contient un corps", ["La masse", "Le volume", "Le poids", "La densité"], "Elle s'exprime en kilogrammes et ne change pas d'un lieu à un autre, contrairement au poids.", "Programme A1 (A1 et B1 ; pas de définition physique au Larousse en ligne)", "D"],
["PN1_01-52", "F", "Espace occupé par un corps", ["Le volume", "La masse", "La surface", "La longueur"], "Pour un solide irrégulier, on le mesure par déplacement d'eau dans une éprouvette graduée.", "Larousse : volume (sens 2)", "D"],
["PN1_01-53", "M", "Rapport de la masse d'un corps à son volume", ["La masse volumique", "La densité", "La pression", "La concentration"], "Elle dépend de la substance : environ 7 800 kg/m³ pour l'acier, 2 700 kg/m³ pour l'aluminium.", "Programme A1 (pas de définition au Larousse en ligne)", "D"],
["PN1_01-54", "M", "Quelle est l'unité de la masse volumique dans le Système international ?", ["Le kg/m³", "Le m³/kg", "Le N/m²", "Le kg·m"], "En pratique, on emploie aussi le g/cm³ : 1 g/cm³ = 1 000 kg/m³.", "Programme A1", "C"],
["PN1_01-55", "F", "Quelle est la formule de la masse volumique ρ ?", ["ρ = m / V", "ρ = V / m", "ρ = m × V", "ρ = m + V"], "m est la masse du corps et V son volume ; on en déduit m = ρ × V.", "Programme A1", "C"],
["PN1_01-56", "M", "Rapport de la masse d'un corps à celle d'un même volume d'eau", ["La densité", "La masse volumique", "La concentration", "La viscosité"], "Elle n'a pas d'unité : un corps de densité 7,8 est 7,8 fois plus massif que l'eau pour le même volume. La densité de l'eau vaut 1.", "Larousse : densité (sens 5)", "D"],
["PN1_01-57", "M", "Quelle est la masse volumique de l'eau pure ?", ["1 000 kg/m³", "100 kg/m³", "10 kg/m³", "1 kg/m³"], "Cela revient à 1 g/cm³, soit 1 kg par litre.", "Programme A1", "C"],
["PN1_01-58", "M", "Un objet de 200 g occupe un volume de 100 cm³. Quelle est sa masse volumique ?", ["2 g/cm³", "0,5 g/cm³", "20 g/cm³", "300 g/cm³"], "ρ = m / V = 200 g / 100 cm³ = 2 g/cm³.", "Programme A1 (calcul court)", "C"],
["g", "Propriétés physiques des métaux"],
["PN1_01-61", "F", "Quel métal est attiré par un aimant ?", ["Le fer", "L'aluminium", "Le cuivre", "L'or"], "Le nickel et le cobalt le sont aussi ; l'aimant permet de distinguer le fer de l'aluminium.", "Programme A1 (distinguer les métaux)", "C"],
["PN1_01-62", "F", "Quel métal est liquide à la température ambiante ?", ["Le mercure", "Le plomb", "Le zinc", "L'étain"], "Le mercure fond à − 39 °C, alors que l'étain fond à 232 °C et le plomb à 327 °C.", "Programme A1 (distinguer les métaux)", "C"],
["PN1_01-63", "F", "Quel métal sert surtout à fabriquer les fils électriques ?", ["Le cuivre", "Le plomb", "Le fer", "Le mercure"], "Excellent conducteur d'électricité, le cuivre se tire facilement en fils ; l'argent conduit mieux mais coûte plus cher.", "Programme A1 (distinguer les métaux)", "C"]
];
const QQ=Q.filter(q=>q[0]!=='g');document.getElementById('tot').textContent=QQ.length;
const st={},cm={},L=document.getElementById('list');
const lbl={F:'Facile',M:'Moyen',D:'Difficile'};
Q.forEach(q=>{if(q[0]==='g'){const h=document.createElement('div');h.className='gh';h.textContent=q[1];L.appendChild(h);return}
const d=document.createElement('div');d.className='qc';d.id='c'+q[0];
d.innerHTML=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap"><span style="font-size:12px;color:var(--text-muted)">${q[0]}</span><span class="bd">${lbl[q[1]]}</span><span class="bd">${(q[0].startsWith('Q')?'Déjà en base · ':'')+(q[6]==='D'?'Définition':'Connaissance')}</span><span class="sr">${q[5]}</span></div>
<div style="font-size:15px;font-weight:500;margin-bottom:6px">${q[2]}</div>
${q[3].map((c,i)=>`<div class="ch ${i===0?'ok':''}">${i===0?'<i class="ti ti-check" aria-hidden="true"></i> ':'<span style="display:inline-block;width:18px"></span>'}${c}</div>`).join('')}
<div style="font-size:13px;color:var(--text-muted);margin:6px 0 8px">${q[4]}</div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="bt v" data-a="v">Valider</button><button class="bt m" data-a="m">À modifier</button><button class="bt r" data-a="r">Rejeter</button></div>
<input type="text" placeholder="Que faut-il changer ?" style="display:none;width:100%;margin-top:8px">`;
const inp=d.querySelector('input');inp.oninput=()=>{cm[q[0]]=inp.value;document.getElementById('err').textContent=''};
d.querySelectorAll('button').forEach(b=>b.onclick=()=>set(q[0],b.dataset.a));L.appendChild(d)});
function set(id,a){st[id]=a;const d=document.getElementById('c'+id);d.className='qc '+a;
d.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.a===a));
d.querySelector('input').style.display=a==='m'?'block':'none';
document.getElementById('cnt').textContent=Object.keys(st).length;document.getElementById('err').textContent=''}
document.getElementById('allv').onclick=()=>QQ.forEach(q=>{if(!st[q[0]])set(q[0],'v')});
document.getElementById('send').onclick=()=>{const e=document.getElementById('err');
const n=QQ.filter(q=>!st[q[0]]).map(q=>q[0]);if(n.length){e.textContent=n.length+' question(s) non traitée(s) : '+n.slice(0,6).join(', ')+(n.length>6?'…':'');return}
const m=QQ.filter(q=>st[q[0]]==='m');const bad=m.filter(q=>!(cm[q[0]]||'').trim());if(bad.length){e.textContent='Précise la modification pour '+bad.map(q=>q[0]).join(', ');return}
const v=QQ.filter(q=>st[q[0]]==='v').map(q=>q[0]),r=QQ.filter(q=>st[q[0]]==='r').map(q=>q[0]);
sendPrompt(`Validation Physique NS1 ch.1 (Grandeurs, mesures et états de la matière) — Validées (${v.length}) : ${v.join(', ')||'aucune'} · Rejetées (${r.length}) : ${r.join(', ')||'aucune'} · À modifier (${m.length}) : ${m.map(q=>q[0]+' → '+cm[q[0]]).join(' ; ')||'aucune'}`)};
</script>
