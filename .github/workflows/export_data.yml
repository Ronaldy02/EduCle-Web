name: Sync questions depuis Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'  # chaque dimanche à 4h UTC

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer psycopg2
        run: pip install psycopg2-binary

      - name: Exporter les données
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/export_supabase.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/questions.json
          git diff --staged --quiet && echo "Aucun changement." || (
            git commit -m "chore(data): sync questions depuis Supabase [skip ci]"
            git push
          )
