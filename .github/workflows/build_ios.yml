name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'ios/**'

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances
        run: flutter pub get

      - name: Build iOS sans signature
        run: flutter build ios --release --no-codesign

      - name: Créer le fichier IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r EduCle.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EduCle-iOS
          path: EduCle.ipa
          retention-days: 30
