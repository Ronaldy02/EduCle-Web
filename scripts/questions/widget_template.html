<h2 class="sr-only">Validation une à une des questions du chapitre Biologie __TITRE__.</h2>
<style>
.qc{border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;margin:0 0 10px;background:var(--surface-2)}
.qc.v{border-color:var(--border-success)}.qc.r{border-color:var(--border-danger)}.qc.m{border-color:var(--border-warning)}
.ch{font-size:14px;padding:2px 0;color:var(--text-secondary)}.ch.ok{color:var(--text-success);font-weight:500}
.bt{font-size:13px;padding:4px 10px}.bt.on.v{background:var(--bg-success);color:var(--text-success)}.bt.on.r{background:var(--bg-danger);color:var(--text-danger)}.bt.on.m{background:var(--bg-warning);color:var(--text-warning)}
.bd{font-size:11px;padding:2px 8px;border-radius:var(--radius);background:var(--surface-1);color:var(--text-secondary)}
.sr{font-size:11px;padding:2px 8px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent)}
.gh{font-size:13px;color:var(--text-secondary);margin:1rem 0 8px}
</style>
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0.5rem 0 0.5rem">
<span style="font-size:14px;color:var(--text-secondary)">Traitées : <b id="cnt" style="font-weight:500;color:var(--text-primary)">0</b> / <span id="tot"></span></span>
<button class="bt" id="allv"><i class="ti ti-checks" aria-hidden="true"></i> Valider les non traitées</button>
</div>
<div id="list"></div>
<div style="padding:0.5rem 0 1rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
<button id="send">Envoyer mes validations ↗</button>
<span id="err" style="font-size:13px;color:var(--text-danger)"></span>
</div>
<script>
const Q=__Q__;
const QQ=Q.filter(q=>q[0]!=='g');document.getElementById('tot').textContent=QQ.length;
const st={},cm={},L=document.getElementById('list');
const lbl={F:'Facile',M:'Moyen',D:'Difficile'};
Q.forEach(q=>{if(q[0]==='g'){const h=document.createElement('div');h.className='gh';h.textContent=q[1];L.appendChild(h);return}
const d=document.createElement('div');d.className='qc';d.id='c'+q[0];
d.innerHTML=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap"><span style="font-size:12px;color:var(--text-muted)">${q[0]}</span><span class="bd">${lbl[q[1]]}</span><span class="bd">${(q[0].startsWith('Q')?'Déjà en base · ':'')+(q[6]==='D'?'Définition':'Connaissance')}</span><span class="sr">${q[5]}</span></div>
<div style="font-size:15px;font-weight:500;margin-bottom:6px">${q[2]}</div>
${q[3].map((c,i)=>`<div class="ch ${i===0?'ok':''}">${i===0?'<i class="ti ti-check" aria-hidden="true"></i> ':'<span style="display:inline-block;width:18px"></span>'}${c}</div>`).join('')}
<div style="font-size:13px;color:var(--text-muted);margin:6px 0 8px">${q[4]}</div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="bt v" data-a="v">Valider</button><button class="bt m" data-a="m">À modifier</button><button class="bt r" data-a="r">Rejeter</button></div>
<input type="text" placeholder="Que faut-il changer ?" style="display:none;width:100%;margin-top:8px">`;
const inp=d.querySelector('input');inp.oninput=()=>{cm[q[0]]=inp.value;document.getElementById('err').textContent=''};
d.querySelectorAll('button').forEach(b=>b.onclick=()=>set(q[0],b.dataset.a));L.appendChild(d)});
function set(id,a){st[id]=a;const d=document.getElementById('c'+id);d.className='qc '+a;
d.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.a===a));
d.querySelector('input').style.display=a==='m'?'block':'none';
document.getElementById('cnt').textContent=Object.keys(st).length;document.getElementById('err').textContent=''}
document.getElementById('allv').onclick=()=>QQ.forEach(q=>{if(!st[q[0]])set(q[0],'v')});
document.getElementById('send').onclick=()=>{const e=document.getElementById('err');
const n=QQ.filter(q=>!st[q[0]]).map(q=>q[0]);if(n.length){e.textContent=n.length+' question(s) non traitée(s) : '+n.slice(0,6).join(', ')+(n.length>6?'…':'');return}
const m=QQ.filter(q=>st[q[0]]==='m');const bad=m.filter(q=>!(cm[q[0]]||'').trim());if(bad.length){e.textContent='Précise la modification pour '+bad.map(q=>q[0]).join(', ');return}
const v=QQ.filter(q=>st[q[0]]==='v').map(q=>q[0]),r=QQ.filter(q=>st[q[0]]==='r').map(q=>q[0]);
sendPrompt(`__PREFIXE__ — Validées (${v.length}) : ${v.join(', ')||'aucune'} · Rejetées (${r.length}) : ${r.join(', ')||'aucune'} · À modifier (${m.length}) : ${m.map(q=>q[0]+' → '+cm[q[0]]).join(' ; ')||'aucune'}`)};
</script>
